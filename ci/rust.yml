# To activate: move this file to .github/workflows/rust.yml (the bot token lacks the GitHub `workflow` scope, so it cannot push workflow files).
# Continuous integration: build, test, clippy and docs across Linux, Windows and macOS,
# plus an MSRV build check.
name: Rust

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install desktop development libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libxrandr-dev libxcursor-dev libxinerama-dev
      - name: Build
        run: cargo build --all-targets
      - name: Test without a display server
        run: cargo test --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps
      - name: Upload golden test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-artifacts-${{ matrix.os }}
          path: |
            tests/golden/*.actual.png
            tests/golden/*.diff.png
          if-no-files-found: ignore

  msrv:
    name: msrv (1.85.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - name: Install desktop development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libxrandr-dev libxcursor-dev libxinerama-dev
      - name: Build library
        run: cargo build --lib
