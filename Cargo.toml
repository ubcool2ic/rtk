[package]
name = "rtk"
version = "0.8.2"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A small tkinter-style GUI library with an arena-based Rust API"
readme = "README.md"

[features]
default = []
accesskit = ["dep:accesskit", "dep:accesskit_winit"]

[dependencies]
winit = "0.30"
softbuffer = "0.4"
tiny-skia = "0.11"
cosmic-text = "0.12"
accesskit = { version = "0.25", optional = true }
accesskit_winit = { version = "0.34", optional = true }

[profile.dev]
debug = 0
