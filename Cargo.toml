[package]
name = "rtk"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A small tkinter-style GUI library with an arena-based Rust API"
readme = "README.md"

[features]
default = ["clipboard", "svg"]
clipboard = ["dep:arboard"]
svg = ["dep:resvg"]
tray = ["dep:tray-icon"]
accesskit = ["dep:accesskit", "dep:accesskit_winit"]
native-dialogs = ["dep:rfd"]

[dependencies]
winit = "0.30"
softbuffer = "0.4"
tiny-skia = "0.11"
cosmic-text = "0.12"
accesskit = { version = "0.25", optional = true }
accesskit_winit = { version = "0.34", optional = true }
arboard = { version = "3", optional = true, default-features = false }
resvg = { version = "0.45", default-features = false, optional = true }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"], optional = true }
rfd = { version = "0.17.2", optional = true, default-features = false, features = ["xdg-portal"] }

[profile.dev]
debug = 0
