[package]
name = "rtk"
version = "0.8.2"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "A small tkinter-style GUI library with an arena-based Rust API"
readme = "README.md"

[features]
default = ["svg"]
svg = ["dep:resvg"]
tray = ["dep:tray-icon"]

[dependencies]
winit = "0.30"
softbuffer = "0.4"
tiny-skia = "0.11"
cosmic-text = "0.12"
resvg = { version = "0.45", default-features = false, optional = true }
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"], optional = true }

[profile.dev]
debug = 0
